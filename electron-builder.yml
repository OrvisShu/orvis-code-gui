appId: com.orvis.code-gui
productName: Orvis Code GUI
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc.cjs,.prettierrc.json,.gitignore}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - '**/*.node'
win:
  target:
    - nsis
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
